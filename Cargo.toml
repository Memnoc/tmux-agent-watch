[package]
name = "tmux-agent-watch"
version = "2.0.0-alpha.1"
edition = "2024"
description = "A stateless, tmux-native supervisor for coding-agent workspaces"
license = "MIT"
repository = "https://github.com/Memnoc/tmux-agent-watch"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.28.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
thiserror = "2.0.18"

[profile.release]
lto = "thin"
strip = true

